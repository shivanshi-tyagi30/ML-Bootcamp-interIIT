# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository. Render asks for the three keys.
services:
  - type: web
    name: trace
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY      # writes the minutes (aistudio.google.com -> Get API key)
        sync: false
      - key: GROQ_API_KEY        # Whisper large-v3 transcription (console.groq.com -> API Keys)
        sync: false
      - key: ASSEMBLYAI_API_KEY  # speaker labels (assemblyai.com -> sign up -> API key)
        sync: false
